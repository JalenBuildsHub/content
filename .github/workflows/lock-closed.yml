name: "Lock old issues and pull requests"
on:
  schedule:
    - cron: "0 9 1 * *"

permissions:
  # Lock discussions.
  discussions: write
  # Lock issues.
  issues: write
  # Lock pull requests.
  pull-requests: write

jobs:
  lock:
    uses: mdn/workflows/.github/workflows/lock-closed.yml@dd85d03f103d3d23f8def99e8ade7f3be066db51 # mdn/workflows main @ 2026-10-05
    with:
      target-repo: "mdn/content"
